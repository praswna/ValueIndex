[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valueindex"
version = "0.1.0"
description = "US market valuation indicator comparison dashboard (CAPE, Buffett Indicator, and friends)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35",
    "pandas>=2.0",
    "plotly>=5.20",
    "requests>=2.31",
    "lxml>=5.0",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valueindex = ["sample_data/*.csv", "sample_data/*.json", "content/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit live data sources (run manually: pytest -m network)",
]
addopts = "-m 'not network'"
