[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valueindex"
version = "0.1.0"
description = "US market valuation indicator comparison dashboard (CAPE, Buffett Indicator, and friends)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "lxml>=5.0",
    "xlrd>=2.0",
]

[project.optional-dependencies]
# The local collector GUI (collector_gui.py) uses only stdlib Tkinter + the
# core deps above, plus markdown to rebuild the site — install with ".[site]".
dev = ["pytest>=8", "markdown>=3.5", "plotly>=5.20"]
site = ["markdown>=3.5"]
# The legacy Streamlit dashboard (app.py) — no longer the canonical UI.
app = ["streamlit>=1.35", "plotly>=5.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valueindex = ["sample_data/*.csv", "sample_data/*.json", "content/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit live data sources (run manually: pytest -m network)",
    "e2e: JS parity tests in a browser (run manually: pytest -m e2e; needs playwright)",
]
addopts = "-m 'not network and not e2e'"
