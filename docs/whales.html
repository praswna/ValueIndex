<body>
<main>
  <h1>🐋 큰손 추적기</h1>
  <p class="caption">큰손들의 미국주식 운용규모입니다. 누르면 보유 종목과 분기 변화가 뜹니다.</p>
  <div id="unavailable"></div>
  <div class="tiles" id="whale-tiles"></div>

  <details class="vi">
    <summary>이게 무슨 데이터인가요?</summary>
    미국 상장주식을 <b>1억 달러 이상</b> 굴리는 기관은 분기마다 보유 종목 전체를
    SEC(미 증권거래위)에 <b>13F</b>로 공시합니다. 갱신은 <b>분기 단위</b>(분기말 45일 뒤
    공시)라 매일 볼 데이터가 아니고, <b>미국 상장주식만</b> 담겨 채권·현금·해외주식은
    안 나옵니다 — 특히 국민연금은 미국 주식 부분만 보입니다.
  </details>
</main>
