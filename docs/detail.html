<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValueIndex — 지표 상세</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/vendor/plotly-cartesian-3.1.0.min.js"></script>
</head>
<body>
<main>
  <h1>🔍 지표 상세</h1>

  <div id="hist" class="chart"></div>
  <details class="vi" open>
    <summary>📖 이 지표 쉽게 이해하기</summary>
    <div id="explain"></div>
  </details>
</main>
<script type="module" src="assets/js/pages/detail.js"></script>

</html>
