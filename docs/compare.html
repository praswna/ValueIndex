<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValueIndex — 지표 비교 차트</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/vendor/plotly-cartesian-3.1.0.min.js"></script>
</head>
<body>
<main>
  <h1>📈 지표 비교 차트</h1>
  <p class="caption">비교할 지표를 고르세요 (최대 4개 — 많을수록 읽기 어려워집니다)</p>
  <div class="check-row" id="picker"></div>
  <div class="controls">
    <div class="control">표시 방식
      <span class="check-row" id="norm-btns"></span>
    </div>
    <label class="control">시작 연도: <b id="from-label"></b>
      <input type="range" id="from-year" step="1">
    </label>
    <label class="control"><span><input type="checkbox" id="rec" checked> 경기침체 음영</span></label>
  </div>
  <div id="chart" class="chart"></div>
  <p class="caption" id="norm-note"></p>

  <h2>지표 상관관계</h2>
  <p class="caption">방향을 정렬한(높을수록 고평가) 백분위끼리의 상관계수입니다.
    밸류에이션 지표들은 서로 상관이 높습니다 — <b>지표를 늘려도 정보가 비례해 늘지 않는
    이유</b>이자, 여러 지표가 같은 방향을 가리킬 때 신뢰가 커지는 이유입니다.</p>
  <div id="heatmap" class="chart"></div>
</main>
<script type="module" src="assets/js/pages/compare.js"></script>
</body>
</html>
