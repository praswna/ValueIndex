name: Refresh market data

on:
  schedule:
    # 22:00 UTC daily = 07:00 KST next morning
    - cron: "0 22 * * *"
  workflow_dispatch: {}

# pages/id-token needed for the GitHub Pages deployment; issues for the
# rating-change alert.
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Avoid overlapping deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[site]"

      - name: Snapshot yesterday's ratings
        run: cp docs/data/overview.json /tmp/overview_prev.json || true

      - name: Fetch live data into the bundled snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_sample_data.py

      - name: Build static site data (docs/data)
        run: python scripts/build_site_data.py

      - name: Open an issue if a rating band changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_rating_changes.py /tmp/overview_prev.json docs/data/overview.json > /tmp/rating_changes.md
          if [ -s /tmp/rating_changes.md ]; then
            gh issue create \
              --title "🔔 밸류에이션 등급 변화 ($(date +%Y-%m-%d))" \
              --body-file /tmp/rating_changes.md
          else
            echo "No rating changes."
          fi

      - name: Commit refreshed snapshot + site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/valueindex/sample_data docs/data
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "chore: refresh market data + rebuild site"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # auto-enable Pages (Actions source) on first run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
