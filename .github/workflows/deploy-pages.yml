name: Deploy Pages

# Deploys the static site on human commits to docs/ (the daily data refresh
# has its own deploy step). Keeps the published site current during
# development without waiting for the nightly job.

on:
  push:
    branches: [claude/cape-index-comparison-j59yhb]
    paths: ["docs/**"]
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
