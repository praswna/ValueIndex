name: Tests

on:
  push:
    branches: [claude/cape-index-comparison-j59yhb]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + browser
        run: |
          pip install -e ".[dev]"
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Unit tests (offline)
        run: pytest -q

      - name: Build site data + parity fixtures
        env:
          VALUEINDEX_OFFLINE: "1"
        run: |
          python scripts/build_site_data.py
          python scripts/build_parity_fixtures.py

      - name: JS↔Python parity (browser)
        run: pytest -m e2e -q
